<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Watch & Earn</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#111827,#2563eb);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
}

h1{
    text-align:center;
    margin-bottom:8px;
    color:#111827;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:15px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

.signup{
    text-align:center;
    margin-top:20px;
    color:#666;
}

.signup a{
    color:#2563eb;
    font-weight:bold;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

    <h1>Watch & Earn</h1>

    <p class="subtitle">Login to your account</p>

    <form onsubmit="login(event)">

        <input type="email" id="email"
        placeholder="Email Address" required>

        <input type="password" id="password"
        placeholder="Password" required>

        <button type="submit">Login</button>

    </form>

    <div class="signup">
        Don't have an account?
        <a href="signup.html">Create Account</a>
    </div>

</div>

<script>
function login(event){
    event.preventDefault();

    location.href = "dashboard.html";
}
</script>

</body>
</html>
